name: atualizar-feeds
on:
  schedule: [{cron: '17 21 * * *'}]   # diário, 21:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-feeds   # disparo manual e agendado nunca rodam juntos (evita corrida no push)
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - id: feeds
        run: python feeds.py
        continue-on-error: true   # as fontes que deram certo ainda sao publicadas
      - run: |
          git config user.name "feeds-bot"; git config user.email "feeds-bot@users.noreply.github.com"
          git add docs; git diff --cached --quiet || (git commit -m "atualiza feeds" && git pull --rebase -q && git push)
      - if: steps.feeds.outcome == 'failure'
        run: echo 'Alguma fonte falhou (ver o passo feeds.py); as outras foram publicadas.' && exit 1
